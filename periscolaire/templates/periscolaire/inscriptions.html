<!DOCTYPE html>
<html>
<head>
    <title>Inscriptions</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f5f5f5; }
        h1 { color: #E8460A; }
        table { background: white; border-collapse: collapse; width: 100%; }
        th { background: #E8460A; color: white; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        nav a { margin-right: 20px; color: #E8460A; text-decoration: none; font-weight: bold; }
        .confirme { color: green; font-weight: bold; }
        .annule { color: red; font-weight: bold; }
        .attente { color: orange; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="/enfants/">👶 Enfants</a>
        <a href="/activites/">🎯 Activités</a>
        <a href="/inscriptions/">📋 Inscriptions</a>
        <a href="/admin/">⚙️ Admin</a>
    </nav>
    <h1>📋 Liste des Inscriptions</h1>
    <table>
        <tr>
            <th>Enfant</th>
            <th>Activité</th>
            <th>Date</th>
            <th>Statut</th>
        </tr>
        {% for inscription in inscriptions %}
        <tr>
            <td>{{ inscription.enfant }}</td>
            <td>{{ inscription.activite }}</td>
            <td>{{ inscription.date }}</td>
            <td class="{{ inscription.statut }}">{{ inscription.get_statut_display }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
